services:
  jekyll-site:
    image: jekyll-site
    build: .
    volumes: [ .:/usr/src/app ]
    ports:
      - "4000:4000"
      - "35729:35729"   # livereload
    user: 1000:1000
    environment: [ JEKYLL_ENV=docker ]
    # Serve with auto-rebuild + browser auto-refresh: http://localhost:4000
    command: jekyll serve -H 0.0.0.0 -w --livereload --force_polling --config _config.yml,_config_docker.yml
