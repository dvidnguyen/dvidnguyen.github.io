# Lightweight checks: JS syntax + Jekyll build. Deploy is handled by jekyll.yml.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ["master"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint JS (syntax check)
        run: |
          for f in assets/js/_main.js assets/js/theme.js assets/js/plugins/jquery.greedy-navigation.js; do
            node --check "$f"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
